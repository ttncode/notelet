name: Release

on:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Refuse to release without the updater public key
        shell: bash
        run: |
          if grep -q SET_IN_RELEASE_SETUP desktop/tauri.conf.json; then
            echo "::error::desktop/tauri.conf.json still has the placeholder updater pubkey; installs from this release could never update."
            exit 1
          fi
      - run: npm test
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo test --manifest-path desktop/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Notelet ${{ github.ref_name }}
          releaseBody: See the README for install and update steps.
          releaseDraft: false
          includeUpdaterJson: true
          tauriScript: npx tauri
